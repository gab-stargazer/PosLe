name: Android Staging Build

on:
  push:
    branches: ['staging**']
  workflow_dispatch:

jobs:
  build-staging-apk:
    name: Build Staging APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Inject google-services.json (debug — staging derives from it)
        shell: bash
        run: |
          mkdir -p androidApp/src/debug
          B64B64="${{ secrets.GOOGLE_SERVICES_DEBUG_JSON }}"
          if [ -z "$B64B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_DEBUG_JSON is empty or not set — add it in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          # Double-base64: stored secret is base64(base64(json)) — no newlines/quotes/escapes.
          printf '%s' "$B64B64" | base64 -d | base64 -d > androidApp/src/debug/google-services.json
          python3 -c 'import json; d=json.load(open("androidApp/src/debug/google-services.json")); assert d["project_info"]["project_id"]=="posle-dev" and any(c["client_info"]["android_client_info"]["package_name"]=="org.lelestacia.posle.dev" for c in d["client"]); print("debug google-services.json OK (posle-dev)")'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build staging APK
        shell: bash
        run: ./gradlew :androidApp:assembleStaging --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-staging-apk
          path: androidApp/build/outputs/apk/staging/*.apk
          if-no-files-found: error
