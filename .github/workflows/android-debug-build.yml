name: Android Debug Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Inject google-services.json (debug)
        shell: bash
        run: |
          mkdir -p androidApp/src/debug
          B64B64="${{ secrets.GOOGLE_SERVICES_DEBUG_JSON }}"
          if [ -z "$B64B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_DEBUG_JSON is empty or not set — add it in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          # Double-base64: stored secret is base64(base64(json)) — no newlines/quotes/escapes.
          printf '%s' "$B64B64" | base64 -d | base64 -d > androidApp/src/debug/google-services.json
          python3 -c 'import json; d=json.load(open("androidApp/src/debug/google-services.json")); assert d["project_info"]["project_id"]=="posle-dev" and any(c["client_info"]["android_client_info"]["package_name"]=="org.lelestacia.posle.dev" for c in d["client"]); print("debug google-services.json OK (posle-dev)")'

      - name: Inject google-services.json (release)
        shell: bash
        run: |
          mkdir -p androidApp/src/release
          B64B64="${{ secrets.GOOGLE_SERVICES_RELEASE_JSON }}"
          if [ -z "$B64B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_RELEASE_JSON is empty or not set — add it in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          # Double-base64: stored secret is base64(base64(json)) — no newlines/quotes/escapes.
          printf '%s' "$B64B64" | base64 -d | base64 -d > androidApp/src/release/google-services.json
          python3 -c 'import json; d=json.load(open("androidApp/src/release/google-services.json")); assert d["project_info"]["project_id"]=="posle-833f7" and any(c["client_info"]["android_client_info"]["package_name"]=="org.lelestacia.posle" for c in d["client"]); print("release google-services.json OK (posle-833f7)")'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
